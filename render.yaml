# Render Blueprint: one Docker web service serving the Vite frontend and the
# FastAPI backend from the same origin.
#
# Deploy: push this file, then in Render choose "New > Blueprint" and pick this
# repo (or create a Web Service manually with the same settings).
services:
  - type: web
    name: client-churn-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Free plan has no persistent disk, so history resets on redeploy/restart.
      - key: CHURN_DB_PATH
        value: /tmp/history.db
      # Optional: turn on real AI retention briefs. Set the value in the Render
      # dashboard (never in this file).
      # - key: BRIEF_LLM_API_KEY
      #   sync: false
      # - key: BRIEF_LLM_MODEL
      #   value: gpt-4o-mini
